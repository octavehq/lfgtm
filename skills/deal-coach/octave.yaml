# Octave run declarations: hints the Octave app reads when this skill runs
# there (typed inputs and the connections it uses). Other hosts ignore this
# file. Every input is optional unless `required: true`; the free-text request
# is always offered beside them.
inputs:
  - id: company
    kind: company
    label: Company
    help: The account's domain.
  - id: contact
    kind: person
    label: Buyer
    help: The buyer's email or LinkedIn profile URL, to coach one conversation.
  - id: stage
    kind: select
    label: Framing
    options: [resonate, elevate, compel]
    help: Optional Resonate, Elevate or Compel framing.
requires:
  optional: [crm, call_recorder]
